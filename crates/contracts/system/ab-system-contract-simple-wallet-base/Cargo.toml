[package]
name = "ab-system-contract-simple-wallet-base"
description = ""
license = "0BSD"
version = "0.0.1"
authors = ["Nazar Mokrynskyi <nazar@mokrynskyi.com>"]
edition = "2024"
include = [
    "/src",
    "/Cargo.toml",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
ab-aligned-buffer = { workspace = true, optional = true }
ab-contracts-common = { workspace = true }
ab-contracts-macros = { workspace = true }
ab-contracts-standards = { workspace = true }
ab-core-primitives = { workspace = true }
ab-io-type = { workspace = true }
ab-system-contract-state = { workspace = true }
blake3 = { workspace = true }
no-panic-const = { workspace = true, optional = true }
schnorrkel = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ab-aligned-buffer = { workspace = true }

[[example]]
name = "build-payload"
required-features = ["payload-builder"]

[features]
guest = [
    "ab-contracts-common/guest",
    "ab-contracts-macros/guest",
    "ab-contracts-standards/guest",
]
# Enables payload builder API
payload-builder = [
    "dep:ab-aligned-buffer",
]
# TODO: no-panic coverage is limited:
#  * functions in `seal` and `SimpleWalletBase::authorize()` are not annotated, since `no_panic`
#    can't prove lack of panics in `blake3::Hasher` for input of arbitrary length, in `schnorrkel`
#    and in the public key `expect()` of `SimpleWalletBase::authorize()`
#  * functions that call methods of the executor through `Env` are not annotated, since `no_panic`
#    can't prove lack of panics in them
# Check that code can't panic under any conditions
no-panic = [
    "dep:no-panic-const",
    # Helps with testing on CPUs without AVX512 support
    "blake3/no_avx512",
]

[lints]
workspace = true
