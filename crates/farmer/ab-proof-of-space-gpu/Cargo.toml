[package]
name = "ab-proof-of-space-gpu"
description = "Proof of space plotting utilities for GPU (Vulkan/Metal)"
license = "0BSD"
version = "0.1.0"
authors = ["Nazar Mokrynskyi <nazar@mokrynskyi.com>"]
edition = "2024"
include = [
    "/src",
    "/build.rs",
    "/Cargo.toml",
]

[package.metadata.docs.rs]
all-features = true

# TODO: Benches

[dependencies]
ab-blake3 = { workspace = true }
ab-chacha8 = { workspace = true }
derive_more = { workspace = true, features = ["from", "into"] }
spirv-std = { workspace = true }

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
ab-core-primitives = { workspace = true }
ab-erasure-coding = { workspace = true }
ab-farmer-components = { workspace = true }
ab-proof-of-space = { workspace = true }
anyhow = { workspace = true }
async-lock = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
rayon = { workspace = true }
rclite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
chacha20 = { workspace = true, features = ["rng"] }
futures = { workspace = true, features = ["executor"] }
rand = { workspace = true }

[build-dependencies]
cargo-gpu-install = { workspace = true, optional = true }

[features]
default = [
    "build-shader",
]
# Enabled by default for the host, shader code disables this feature to remove build dependencies
build-shader = [
    "dep:cargo-gpu-install",
]

[lints]
workspace = true
