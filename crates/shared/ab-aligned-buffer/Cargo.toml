[package]
name = "ab-aligned-buffer"
description = "Efficient abstraction for aligned memory buffers with both owned and shared variants"
keywords = ["alignment", "aligned", "buffer", "rc", "no-std"]
categories = ["data-structures", "no-std", "rust-patterns"]
repository = "https://github.com/nazar-pc/abundance"
license = "0BSD"
version = "0.2.0"
authors = ["Nazar Mokrynskyi <nazar@mokrynskyi.com>"]
edition = "2024"
rust-version = "1.89"
include = [
    "/src",
    "/Cargo.toml",
    "/CHANGELOG.md",
]

[package.metadata.docs.rs]
all-features = true

[lib]
# Necessary for CLI options to work on benches
bench = false

[[bench]]
name = "aligned_buffer"
harness = false

[dependencies]
ab-io-type = { workspace = true, optional = true }
no-panic = { workspace = true, optional = true }
stable_deref_trait = { workspace = true }
yoke = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
# Typed reads of `ab-io-type`'s trivial types, requires nightly Rust like `ab-io-type` itself
io-type = [
    "dep:ab-io-type",
]
# Check that the crate can't panic, except for infallible allocations that are too large or that the
# allocator fails, and creation of too many references to a shared allocation on 32-bit targets
no-panic = [
    "dep:no-panic",
    # Typed reads are checked too
    "io-type",
]

[lints]
workspace = true
