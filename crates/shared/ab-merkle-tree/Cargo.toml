[package]
name = "ab-merkle-tree"
description = "High-performance Merkle Tree and related data structures (Merkle Mountain Range, Sparse Merkle Tree)"
keywords = ["crypto", "merkle-tree", "mmr", "blake3", "no-std"]
categories = ["algorithms", "cryptography", "data-structures", "no-std::no-alloc"]
repository = "https://github.com/nazar-pc/abundance"
homepage = "https://github.com/nazar-pc/abundance/tree/main/crates/shared/ab-merkle-tree"
license = "0BSD"
version = "0.3.0"
authors = ["Nazar Mokrynskyi <nazar@mokrynskyi.com>"]
edition = "2024"
include = [
    "/benches",
    "/src",
    "/tests",
    "/Cargo.toml",
    "/CHANGELOG.md",
]

[package.metadata.docs.rs]
all-features = false
features = ["alloc", "blake3"]

[lib]
# Necessary for CLI options to work on benches
bench = false

[[bench]]
name = "balanced"
harness = false

[[bench]]
name = "unbalanced"
harness = false

[[bench]]
name = "mmr"
harness = false

[[bench]]
name = "sparse"
harness = false

[dependencies]
ab-blake3 = { workspace = true, optional = true }
array-reshape = { workspace = true }
# NOTE: The `blake3` dependency is here only for `no-panic` feature
blake3 = { workspace = true, optional = true }
no-panic = { workspace = true, optional = true }

[dev-dependencies]
# Benchmarks use BLAKE3 hasher
ab-merkle-tree = { path = ".", features = ["blake3"] }
chacha20 = { workspace = true, features = ["rng"] }
criterion = { workspace = true }
trybuild = { workspace = true }

[features]
alloc = []
# BLAKE3 hasher and aliases of all trees that use it
blake3 = ["dep:ab-blake3"]
# Check that code can't panic under any conditions
no-panic = [
    "blake3",
    "dep:no-panic",
    "dep:blake3",
    # Helps with testing on CPUs without AVX512 support
    "blake3?/no_avx512",
]

[lints]
workspace = true
