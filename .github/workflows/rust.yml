name: Rust

on:
  push:
    branches:
      - claude/windows-build-timings
  pull_request:
  workflow_dispatch:

env:
  # Not needed in CI, should make things a bit faster
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  # Build smaller artifacts to avoid running out of space in CI and make it a bit faster.
  RUSTFLAGS: -C strip=symbols
  RUST_BACKTRACE: full

jobs:
  # One-off experiment: compare `no-panic` builds with and without kache on the same runner, with per-unit timings and
  # kache debug logs
  no-panic-timings:
    name: no-panic-timings (${{ matrix.platform.name }}, cache-executables=${{ matrix.cache-executables }})
    strategy:
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-26.04 }
          - { name: linux-aarch64, runner: ubuntu-26.04-arm }
          - { name: windows-x86_64, runner: windows-2025 }
          - { name: windows-aarch64, runner: windows-11-arm }
        cache-executables:
          - 'true'
          - 'false'
      fail-fast: false

    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: 'false'

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install kache
        uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c # v1
        with:
          version: v2.0.0-rc.3
          cache-c-cpp: 'true'
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: ${{ matrix.cache-executables }}
          github-cache: 'false'
          job-summary: 'false'
          pr-comment: 'false'

      - name: Install wild-linker
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # 2.87.32
        with:
          tool: wild-linker
        if: runner.os == 'Linux'

      - name: Use Wild linker on Linux
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -C linker=clang -C link-arg=--ld-path=wild" >> $GITHUB_ENV
        if: runner.os == 'Linux'

      - name: Use LLD linker on Windows
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -C linker=rust-lld" >> $GITHUB_ENV
        if: runner.os == 'Windows'

      # Same flags as `no-panic` job in the regular workflow
      - name: Set up RUSTFLAGS
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -Cllvm-args=--inline-threshold=10000 -C embed-bitcode -C lto -Z dylib-lto -C target-cpu=native" >> $GITHUB_ENV

      # Installs the toolchain and downloads dependencies, so that neither is included in measurements below
      - name: Fetch dependencies
        shell: bash
        run: |
          rustup toolchain install
          cargo -Zgitoxide -Zgit fetch --locked

      # Sequential builds with a separate target directory each, so that timings are not skewed by concurrent builds.
      # Both modes run on the same runner, since performance differs a lot between runners of the same type. An untimed
      # warm-up build without kache first brings the toolchain, dependency sources and linker into OS caches (and past
      # any first-access scanning), so that whichever build happens to run first is not penalized. The order of modes
      # also alternates between crates to cancel out any remaining effects of warm caches. A small crate shows fixed
      # per-unit overhead, while a large crate is dominated by compilation itself.
      - name: Build with timings
        shell: bash
        run: |
          build() {
            local crate="$1"
            local mode="$2"
            local target_dir="${3:-target_${crate}_${mode}}"
            # Debug logs are only collected for builds with kache
            local -a env_cmd=(env KACHE_LOG=kache=debug)
            if [[ "${mode}" == "no-kache" ]]; then
              # Everything kache action sets up to wrap Rust, C and C++ compilers
              env_cmd=(env -u RUSTC_WRAPPER -u CC_KNOWN_WRAPPER_CUSTOM -u CMAKE_C_COMPILER_LAUNCHER -u CMAKE_CXX_COMPILER_LAUNCHER)
              for var in $(compgen -e | grep -E '^(CC|CXX)_'); do
                env_cmd+=(-u "${var}")
              done
            fi

            echo "::group::${crate} (${mode}, ${target_dir})"
            local start
            start=$(date +%s)
            CARGO_TARGET_DIR="${target_dir}" "${env_cmd[@]}" cargo -Zgitoxide -Zgit build --locked --release \
              --all-targets --features no-panic --package "${crate}" --timings
            local end
            end=$(date +%s)
            echo "::endgroup::"
            echo "\`${crate}\` (${mode}, ${target_dir}): $((end - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          # Untimed warm-up, its time is still printed for reference
          build ab-blake3 no-kache target_warmup
          build ab-riscv-interpreter no-kache target_warmup
          rm -rf target_warmup

          build ab-blake3 no-kache
          build ab-blake3 kache
          build ab-riscv-interpreter kache
          build ab-riscv-interpreter no-kache

      - name: Upload timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: timings-${{ matrix.platform.name }}-cache-executables-${{ matrix.cache-executables }}
          path: target_*/cargo-timings/cargo-timing-*.html
          retention-days: 7
        if: always()

      # Diagnostics requested by kache's bug report template, plus everything from kache's data and runtime directories
      # (logs, including the daemon's startup log)
      - name: Collect kache diagnostics
        shell: bash
        run: |
          mkdir -p kache-diagnostics
          kache="$(command -v kache || cygpath "${RUSTC_WRAPPER}" 2>/dev/null || echo "${RUSTC_WRAPPER}")"
          "${kache}" doctor --verify > kache-diagnostics/doctor.txt 2>&1 || true
          "${kache}" stats > kache-diagnostics/stats.txt 2>&1 || true
          "${kache}" report --since 24h > kache-diagnostics/report.txt 2>&1 || true
          "${kache}" daemon status > kache-diagnostics/daemon-status.txt 2>&1 || true

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            data_dir="$(cygpath "$LOCALAPPDATA")/kache"
          else
            data_dir="$HOME/.cache/kache"
          fi
          runtime_dir="$(cygpath "${KACHE_RUNTIME_DIR}" 2>/dev/null || echo "${KACHE_RUNTIME_DIR}")"
          for entry in "data:${data_dir}" "runtime:${runtime_dir}"; do
            name="${entry%%:*}"
            dir="${entry#*:}"
            if [[ -d "${dir}" ]]; then
              mkdir -p "kache-diagnostics/${name}"
              # Regular files only (skips sockets), large files are unlikely to be logs
              (cd "${dir}" && find . -type f -size -200M -print0 | xargs -0 -r cp --parents -t "${GITHUB_WORKSPACE}/kache-diagnostics/${name}/") || true
            fi
          done
          ls -laR kache-diagnostics
        if: always()

      - name: Upload kache diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: kache-diagnostics-${{ matrix.platform.name }}-cache-executables-${{ matrix.cache-executables }}
          path: kache-diagnostics
          retention-days: 7
        if: always()
