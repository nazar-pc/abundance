name: Rust

on:
  push:
    branches:
      - claude/windows-build-timings
  pull_request:
  workflow_dispatch:

env:
  # Not needed in CI, should make things a bit faster
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  # Build smaller artifacts to avoid running out of space in CI and make it a bit faster.
  RUSTFLAGS: -C strip=symbols
  RUST_BACKTRACE: full

jobs:
  # One-off experiment: compare `no-panic` builds across platforms with and without kache, with per-unit timings
  no-panic-timings:
    name: no-panic-timings (${{ matrix.platform.name }}, kache=${{ matrix.kache }})
    strategy:
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-26.04 }
          - { name: linux-aarch64, runner: ubuntu-26.04-arm }
          - { name: windows-x86_64, runner: windows-2025 }
          - { name: windows-aarch64, runner: windows-11-arm }
        kache:
          - true
          - false
      fail-fast: false

    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: 'false'

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v1.2.1
          cache-c-cpp: 'true'
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: 'true'
          github-cache: 'false'
          job-summary: 'false'
          pr-comment: 'false'
        if: matrix.kache

      - name: Install wild-linker
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # 2.87.32
        with:
          tool: wild-linker
        if: runner.os == 'Linux'

      - name: Use Wild linker on Linux
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -C linker=clang -C link-arg=--ld-path=wild" >> $GITHUB_ENV
        if: runner.os == 'Linux'

      - name: Use LLD linker on Windows
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -C linker=rust-lld" >> $GITHUB_ENV
        if: runner.os == 'Windows'

      # Same flags as `no-panic` job in the regular workflow
      - name: Set up RUSTFLAGS
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -Cllvm-args=--inline-threshold=10000 -C embed-bitcode -C lto -Z dylib-lto -C target-cpu=native" >> $GITHUB_ENV

      # Installs the toolchain and downloads dependencies, so that neither is included in measurements below
      - name: Fetch dependencies
        shell: bash
        run: |
          rustup toolchain install
          cargo -Zgitoxide -Zgit fetch --locked

      # Sequential builds with a separate target directory each, so that timings are not skewed by concurrent builds.
      # A small crate shows fixed per-unit overhead, while a large crate is dominated by compilation itself.
      - name: Build with timings
        shell: bash
        run: |
          for crate in ab-blake3 ab-riscv-interpreter; do
            echo "::group::${crate}"
            start=$(date +%s)
            CARGO_TARGET_DIR="target_${crate}" cargo -Zgitoxide -Zgit build --locked --release --all-targets \
              --features no-panic --package "${crate}" --timings
            end=$(date +%s)
            echo "::endgroup::"
            echo "\`${crate}\`: $((end - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: timings-${{ matrix.platform.name }}-kache-${{ matrix.kache }}
          path: target_*/cargo-timings/cargo-timing-*.html
          retention-days: 7
        if: always()
